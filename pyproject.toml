# Tooling configuration for the repository (the backend itself installs from backend/requirements*.txt).

[tool.ruff]
target-version = "py312"
line-length = 160
extend-exclude = ["frontend", "research"]

[tool.ruff.lint]
# Errors and likely bugs, not style: pyflakes (F), syntax/statement errors (E4, E7, E9), bugbear's correctness checks.
select = ["F", "E4", "E7", "E9", "B006", "B008", "B012", "B015", "B018", "B904"]
ignore = [
  "E701", "E702",  # a few deliberate one-line statements
  "E731",          # small lambdas assigned to names are used on purpose
  "E741",          # "l" for a line inside short comprehensions
  "B904",          # re-raising without "from" is intentional where the original traceback adds nothing for users
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["B018"]
"backend/research_templates/*" = ["E402"]  # templates explain themselves before importing

[tool.pytest.ini_options]
testpaths = ["backend/tests"]

[tool.coverage.run]
source = ["backend/app"]
omit = ["backend/app/reproduce_template.py"]
