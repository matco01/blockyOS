<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#eceef3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#050507" media="(prefers-color-scheme: dark)" />
    <title>Blocky</title>
    <script>
      // Apply the saved theme before first paint, so there's no flash of the wrong one.
      try {
        var t = JSON.parse(localStorage.getItem("blocky.theme") || '"system"');
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
        var a = JSON.parse(localStorage.getItem("blocky.accent") || '"violet"');
        if (a !== "violet") document.documentElement.dataset.accent = a;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
