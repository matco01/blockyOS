name: Bug report
description: Something doesn't work, or a number looks wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Experiments → … 2. …"
    validations:
      required: true
  - type: textarea
    id: provenance
    attributes:
      label: Provenance (for measurement problems)
      description: Experiments → export JSON, or the run's provenance block (blockyOS commit, protocol, llama.cpp commit, GPU, driver). Remove anything private.
      render: json
  - type: input
    id: version
    attributes:
      label: blockyOS version or commit
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Hardware and OS
      placeholder: "e.g. RTX 4060 8 GB, Ubuntu 24.04 (WSL2)"
