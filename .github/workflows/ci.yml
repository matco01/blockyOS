name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r backend/requirements-dev.txt
      # Includes end-to-end experiments through the whole measurement pipeline with a fake llama.cpp (tests/fake_llama.py).
      # Failing tests become annotations (pytest-github-actions-annotate-failures), readable without signing in.
      # That plugin only reports failures inside a test, so errors while setting up or cleaning up a test are
      # reported from the summary lines (-rfE) by the next step.
      - name: Tests
        run: |
          set -o pipefail
          python -m pytest -q -rfE backend/tests --cov --cov-report=term --cov-report=xml 2>&1 | tee pytest.log
      - name: Report failing tests as annotations
        if: failure()
        run: |
          grep -E "^(FAILED|ERROR) " pytest.log | head -10 | while IFS= read -r line; do echo "::error title=pytest::${line:0:1000}"; done
          echo "::error title=pytest (last lines)::$(tail -25 pytest.log | tr '\n' ' ' | cut -c1-3000)"
      - uses: actions/upload-artifact@v7
        if: matrix.python == '3.12'
        with:
          name: coverage
          path: coverage.xml

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.5
      - run: ruff check backend client
      - run: bash -n scripts/*.sh

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  torch-tools:
    name: PyTorch tools (CPU)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # scripts/setup-ml.sh installs the latest versions; CI pins the ones these tests were checked with (CPU build).
      - run: pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r backend/requirements-dev.txt transformers==5.22.2 accelerate==1.15.0 safetensors==0.8.0 tokenizers==0.23.3
      # The hardware lab's chip physics and math against known values, and one run on a tiny model end to end.
      - name: Tests
        run: |
          set -o pipefail
          python -m pytest -q -rfE backend/tests/test_hwsim.py 2>&1 | tee pytest.log
      - name: Report failing tests as annotations
        if: failure()
        run: |
          grep -E "^(FAILED|ERROR) " pytest.log | head -10 | while IFS= read -r line; do echo "::error title=pytest::${line:0:1000}"; done
          echo "::error title=pytest (last lines)::$(tail -25 pytest.log | tr '\n' ' ' | cut -c1-3000)"

  docker:
    name: Docker image (CPU build, starts and serves)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build the image (CPU)
        run: |
          set -o pipefail
          docker build --progress=plain --build-arg BASE=ubuntu:24.04 -t blockyos:ci . 2>&1 | tee build.log || {
            echo "::error title=docker build (last lines)::$(tail -30 build.log | tr '\n' ' ' | cut -c1-4000)"
            exit 1
          }
      - run: docker run -d --name blocky --network host blockyos:ci
      - name: Serves the API and the UI
        run: |
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:8000/api/status && break; sleep 2; done
          curl -fs http://127.0.0.1:8000/api/projects
          curl -fs http://127.0.0.1:8000/ | grep -q 'id="root"'
          docker exec blocky /opt/blocky/llama.cpp/bin/llama-server --version
          # The optional RPC worker got built too (upstream renamed it once; this notices the next rename).
          curl -fs http://127.0.0.1:8000/api/rpc-worker | grep -q '"installed":true'
      - name: Report the container log as an annotation
        if: failure()
        run: echo "::error title=Container log::$(docker logs blocky 2>&1 | tail -20 | tr '\n' ' ' | cut -c1-3000)"
